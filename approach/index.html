<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ショートアプローチ30</title>
  <meta name="description" content="5〜60ヤードのアプローチを1球ずつ記録し、成功率とトップ率を確認する練習アプリ。">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="アプローチ30">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <div id="errorBar" class="error-bar" role="alert" hidden>
      <span id="errorText"></span>
      <button id="errorClose" class="error-close" type="button" aria-label="閉じる">×</button>
    </div>

    <!-- 画面1：ホーム・練習設定 -->
    <section id="homeView" class="view scroll" hidden>
      <header class="home-head">
        <h1 class="app-title">ショートアプローチ30</h1>
        <p class="app-sub">1球ごとに目標を決めて打つ</p>
      </header>

      <h2 class="label">練習モード</h2>
      <div class="seg" id="modeSeg" role="group" aria-label="練習モード">
        <button type="button" data-mode="random">ランダム</button>
        <button type="button" data-mode="fixed">固定</button>
      </div>

      <h2 class="label">球数</h2>
      <div class="seg" id="countSeg" role="group" aria-label="球数">
        <button type="button" data-count="10">10球</button>
        <button type="button" data-count="20">20球</button>
        <button type="button" data-count="30">30球</button>
      </div>

      <h2 class="label">使用クラブ</h2>
      <div class="seg" id="clubSeg" role="group" aria-label="使用クラブ"></div>

      <h2 class="label">目標距離 <span id="distanceHint" class="hint"></span></h2>
      <div class="dist-grid" id="distGrid" role="group" aria-label="目標距離"></div>

      <p id="startError" class="start-error" hidden></p>
      <button id="startBtn" class="primary-btn" type="button">練習スタート</button>
      <a class="secondary-btn" href="#/history">練習履歴を見る</a>
    </section>

    <!-- 画面2・3：練習中（判定入力とミス原因選択を切り替え） -->
    <section id="playView" class="view play" hidden>
      <header class="play-head">
        <div class="progress-text"><strong id="shotNo">1</strong> / <span id="shotTotal">30</span>球</div>
        <button id="quitBtn" class="quit-btn" type="button">練習を終了</button>
      </header>
      <div class="progress" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>

      <div id="judgePanel" class="panel">
        <div class="target">
          <div class="target-dist"><span id="targetDist">15</span><small>yd</small></div>
          <div class="target-label">目標キャリー</div>
          <div class="target-club">使用クラブ：<strong id="targetClub">SW</strong></div>
        </div>
        <p class="panel-title">打球結果を入力</p>
        <div class="judge-btns">
          <button type="button" class="judge success" data-result="success">○ 成功</button>
          <button type="button" class="judge near" data-result="near">△ 惜しい</button>
          <button type="button" class="judge failure" data-result="failure">× 失敗</button>
        </div>
      </div>

      <div id="missPanel" class="panel" hidden>
        <div class="miss-head">
          <span id="missTarget" class="miss-target">15yd / SW</span>
          <span id="missResult" class="miss-result"></span>
        </div>
        <p class="panel-title">ミス原因を選択</p>
        <div class="miss-btns" id="missBtns"></div>
        <button id="missBack" type="button" class="back-btn">戻る</button>
      </div>

      <footer class="play-foot">
        <button id="undoBtn" type="button" class="undo-btn">1球戻る</button>
        <span id="lastShot" class="last-shot"></span>
      </footer>
    </section>

    <!-- 画面4：練習結果（1回分） -->
    <section id="resultView" class="view scroll" hidden>
      <header class="sub-head">
        <a id="resultBack" class="head-link" href="#/history">‹ 履歴</a>
        <h1 id="resultTitle" class="sub-title">今回の結果</h1>
        <span class="head-space"></span>
      </header>
      <div id="resultBody"></div>
      <a class="primary-btn" href="#/">ホームへ</a>
      <button id="deleteBtn" type="button" class="danger-link">この記録を削除</button>
    </section>

    <!-- 画面4：練習履歴・成績推移 -->
    <section id="historyView" class="view scroll" hidden>
      <header class="sub-head">
        <a class="head-link" href="#/">‹ ホーム</a>
        <h1 class="sub-title">練習履歴</h1>
        <span class="head-space"></span>
      </header>
      <p class="notice">記録はこの端末のブラウザ内にだけ保存されます。Safari の履歴・Webサイトデータの消去や、ホーム画面のアプリの削除で記録も消えます。</p>
      <div id="historyBody"></div>
    </section>
  </div>
</body>
</html>
